<!DOCTYPE html>
<!-- Find the Group — categorisation game. See /js/find-the-group.js for logic. -->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Find the Group — YoursCalmly</title>
  <meta name="description" content="A few pictures appear together — tap the ones that belong to the same familiar group.">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content" data-i18n="common.skipToContent">Skip to main content</a>

  <header class="site-header" id="site-header"></header>

  <div id="zh-note" class="container" role="status" hidden style="padding-top: 0.75rem; color: var(--color-text-muted); font-size: 0.95rem;"></div>

  <main id="main-content" class="site-main">
    <div class="container game-page-header">
      <a class="game-breadcrumb" href="../index.html#games-hub">
        <span aria-hidden="true">&larr;</span>
        <span data-i18n="common.backToGames">Back to games</span>
      </a>
    </div>

    <section class="container">
      <div class="game-intro">
        <h1 data-i18n="findGroup.title">Find the Group</h1>
        <p data-i18n="findGroup.instructions">Tap each picture that belongs in the group. Tap "Check my answer" whenever you feel ready.</p>
      </div>

      <div class="game-shell" id="game-shell">
        <div class="game-progress" id="game-progress"></div>
        <div id="game-feedback" class="feedback-banner" aria-live="polite"></div>
        <div id="game-body"></div>
        <div class="game-actions" id="game-actions"></div>
      </div>

      <p class="take-your-time" data-i18n="common.takeYourTime">Take your time. There is no clock running.</p>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="../js/i18n.js"></script>
  <script src="../js/games-data.js"></script>
  <script src="../js/main.js"></script>
  <script src="../js/game-shell.js"></script>
  <script src="../js/find-the-group.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function () {
      GP.initChrome();
      GP_FindGroup.init();
    });
  </script>
</body>
</html>
